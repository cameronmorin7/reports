<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><title>Document</title>
<style>body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbfaf7; color: #1a1a18; font: 17px/1.6 Georgia, "Times New Roman", serif; }
p { max-width: 30rem; padding: 24px; text-align: center; }</style></head>
<body><p id="say">Opening the document.</p>
<script>
(async function () {
  var say = document.getElementById('say');
  function bytes(s) {
    var bin = atob(s.replace(/-/g, '+').replace(/_/g, '/')), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  var k = location.hash.slice(1);
  if (!k) { say.textContent = 'This link is incomplete. The document opens only with the whole link, as it was sent.'; return; }
  try {
    var key = await crypto.subtle.importKey('raw', bytes(k), 'AES-GCM', false, ['decrypt']);
    var got = await fetch('data.bin?v=7f040ae58235', { cache: 'no-store' });
    if (!got.ok) throw new Error('not there');
    var all = new Uint8Array(await got.arrayBuffer());
    var page = new TextDecoder('utf-8').decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(0, 12) }, key, all.slice(12)));
    document.open(); document.write(page); document.close();
  } catch (e) {
    say.textContent = 'The document could not be opened. Check that the link is whole, as it was sent.';
  }
})();
</script></body></html>
